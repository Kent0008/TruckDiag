version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: truckdiag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: truckdiag_db
      POSTGRES_USER: truckdiag_user
      POSTGRES_PASSWORD: truckdiag_secret_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckdiag_user -d truckdiag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truckdiag-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://truckdiag_user:truckdiag_secret_change_me@db:5432/truckdiag_db
      HOST: "0.0.0.0"
      PORT: "8000"
      CORS_ORIGINS: "[\"*\"]"
      SIMULATOR_UPDATE_INTERVAL_SEC: "1.0"
    ports:
      - "8000:8000"

volumes:
  pgdata:
